name: Deploy my-app

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Serverless Devs CLI
      run: npm install -g @serverless-devs/s

    - name: Create .s directory and config file
      run: |
        mkdir -p .s
        cat <<EOF > .s/config.yaml
        default:
          account-id: ${{ secrets.ALIYUN_ACCOUNT_ID }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        EOF
        # 输出生成的配置文件内容，以便调试
        cat .s/config.yaml

    - name: List files in current directory to confirm path
      run: ls -la

    - name: Print .s/config.yaml content for debugging
      run: cat .s/config.yaml

    - name: Verify configuration is loaded
      run: s config get --access default

    - name: Deploy to Aliyun FC
      if: github.ref == 'refs/heads/develop' # 确保只在特定分支上执行部署
      env:
        ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DATABASE: ${{ secrets.DB_DATABASE }}
      run: |
        pwd # 打印当前工作目录
        WORKSPACE=$(pwd)
        echo "Current workspace: $WORKSPACE"
        # 使用绝对路径指定配置文件
        s deploy -y --use-local --skip-push -t ${WORKSPACE}/s.yaml --config ${WORKSPACE}/.s/config.yaml --access default