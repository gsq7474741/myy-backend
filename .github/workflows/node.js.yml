name: Deploy my-app

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Serverless Devs CLI
      run: npm install -g @serverless-devs/s

    - name: Install dependencies
      run: npm install
    
    - name: Install yq for YAML parsing
      run: |
        sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/bin/yq
    - name: Build project
      run: npm run build

    - name: Create .s directory and config file  
      run: |  
        mkdir -p ${HOME}/runner/.s  
        cat <<EOF > ${HOME}/runner/.s/access.yaml  
        default:  
          accountid: ${{ secrets.ALIYUN_ACCOUNT_ID }}  
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}  
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}  
        EOF

    - name: Verify access.yaml content (for debugging purposes only)
      run: |
        cat ${HOME}/runner/.s/access.yaml  
    
    - name: Check if accountid is present in default section
      run: |
        CONFIG_FILE="${HOME}/runner/.s/access.yaml  "
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "Error: Configuration file not found at $CONFIG_FILE"
          exit 1
        fi
        ACCOUNTID=$(yq eval '.default.accountid' "$CONFIG_FILE")
        ACCESS_KEY_ID=$(yq eval '.default.access-key-id' "$CONFIG_FILE")
        ACCESS_KEY_SECRET=$(yq eval '.default.access-key-secret' "$CONFIG_FILE")
        
        if [ -z "$ACCOUNTID" ]; then
          echo "Error: 'accountid' field is missing or empty in the 'default' section of $CONFIG_FILE"
          exit 1
        else
          echo "Success: 'accountid' field is present and set to '$ACCOUNTID'"
        fi
        
        if [ -z "$ACCESS_KEY_ID" ]; then
          echo "Error: 'access-key-id' field is missing or empty in the 'default' section of $CONFIG_FILE"
          exit 1
        else
          echo "Success: 'access-key-id' field is present and set to '$ACCESS_KEY_ID'"
        fi
        
        if [ -z "$ACCESS_KEY_SECRET" ]; then
          echo "Error: 'access-key-secret' field is missing or empty in the 'default' section of $CONFIG_FILE"
          exit 1
        else
          echo "Success: 'access-key-secret' field is present and set to '$ACCESS_KEY_SECRET'"
        fi

    - name: Deploy to Aliyun FC  
      if: github.ref == 'refs/heads/develop'  
      env:  
        ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}  
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}  
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}  
        DB_HOST: ${{ secrets.DB_HOST }}  
        DB_PORT: ${{ secrets.DB_PORT }}  
        DB_USERNAME: ${{ secrets.DB_USERNAME }}  
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}  
        DB_DATABASE: ${{ secrets.DB_DATABASE }}  
      run: |  
        cat {HOME}/runner/.s/access.yaml  
        pwd  
        WORKSPACE=$(pwd)  
        echo "Current workspace: $WORKSPACE"  
        s deploy --access-file ${HOME}/.s/access.yaml --debug  