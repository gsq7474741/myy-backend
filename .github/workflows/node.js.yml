name: Deploy my-app

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Serverless Devs CLI
      run: npm install -g @serverless-devs/s

    - name: Install dependencies
      run: npm install
    
    - name: Install yq for YAML parsing
      run: |
        sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/bin/yq
    - name: Build project
      run: npm run build

    - name: Create .s directory and config file  
      run: |  
        mkdir -p ${HOME}/.s  
        cat <<EOF > ${HOME}/.s/access.yaml  
        default:  
          accountid: ${{ secrets.ALIYUN_ACCOUNT_ID }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}  
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}  
        EOF

    - name: Verify access.yaml content (for debugging purposes only)
      run: |
        cat ${HOME}/.s/access.yaml
    
    - name: Verify configuration is loaded from default path
      run: s config get --access default
    
    - name: Deploy to Aliyun FC-1  
      if: github.ref == 'refs/heads/develop'  
      env:  
        ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}  
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}  
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}  
        DB_HOST: ${{ secrets.DB_HOST }}  
        DB_PORT: ${{ secrets.DB_PORT }}  
        DB_USERNAME: ${{ secrets.DB_USERNAME }}  
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}  
        DB_DATABASE: ${{ secrets.DB_DATABASE }}  
      run: |  
        cat ${HOME}/.s/access.yaml
        pwd  
        WORKSPACE=$(pwd)  
        echo "Current workspace: $WORKSPACE"  
        s deploy --access-file /home/runner/.s/access.yaml --accountid "200949340564273060" --debug 