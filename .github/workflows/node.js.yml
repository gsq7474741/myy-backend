name: Deploy my-app

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Serverless Devs CLI
      run: npm install -g @serverless-devs/s

    - name: Install dependencies
      run: npm install
    
    - name: Install yq for YAML parsing
      run: |
        sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/bin/yq
    - name: Build project
      run: npm run build


    
    - name: Verify configuration is loaded from default path
      run: s config get --access default
    

    # 上一步配置的密钥就用在这里
    - name: Add Serverless Devs Config
      run: s config add --AccountID ${{ secrets.ACCOUNT_ID }} --AccessKeyID ${{ secrets.ACCESS_KEY_ID }} --AccessKeySecret ${{ secrets.ACCESS_KEY_SECRET }} -a default
      env:  
        ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}  
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}  
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}  
        DB_HOST: ${{ secrets.DB_HOST }}  
        DB_PORT: ${{ secrets.DB_PORT }}  
        DB_USERNAME: ${{ secrets.DB_USERNAME }}  
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}  
        DB_DATABASE: ${{ secrets.DB_DATABASE }} 
    - name: Verify configuration is loaded from default path
      run: s config get --access default 
    - run: s deploy function --type code --use-local
    
    