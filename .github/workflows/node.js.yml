name: Node.js CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]
        # 根据需要选择支持的Node.js版本

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build --if-present

    - name: Run tests
      run: npm test

    - name: Install Serverless Devs CLI
      run: npm install -g @serverless-devs/s

    - name: Add environment variables and credentials
      run: |
        s env add --name default --key ALIYUN_ACCESS_KEY_ID --value "${{ secrets.ALIYUN_ACCESS_KEY_ID }}"
        s env add --name default --key ALIYUN_ACCESS_KEY_SECRET --value "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}"
        s env add --name default --key ALIYUN_ACCOUNT_ID --value "${{ secrets.ALIYUN_ACCOUNT_ID }}"

    - name: Deploy to Aliyun FC
      if: github.ref == 'refs/heads/develop' # 确保只在特定分支上执行部署
      env:
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DATABASE: ${{ secrets.DB_DATABASE }}
      run: |
        s deploy -y --use-local --skip-push -t s.yaml --env default